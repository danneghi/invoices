<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#E86C2A">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Invoices">
  <meta name="application-name" content="Invoices">
  <meta name="description" content="Create, preview, and send PDF invoices from your iPhone.">
  <title>Invoices</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" defer></script>
  <script src="qrcode.min.js" defer></script>
  <style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --orange: #E86C2A;
  --orange-dark: #C4511A;
  --orange-soft: #FFF1E8;
  --bg: #F3EFE9;
  --surface: #FFFFFF;
  --text: #1C1917;
  --text-dim: #6F6A64;
  --line: rgba(28, 25, 23, 0.10);
  --green: #1C6B4A;
  --green-soft: #E8F5EE;
  --blue: #1D4F91;
  --blue-soft: #E8F0FA;
  --red: #C0392B;
  --red-soft: #FDECEA;
  --amber: #B45309;
  --amber-soft: #FEF3C7;
  --shadow: 0 8px 28px rgba(28, 25, 23, 0.08);
  --radius: 16px;
  --radius-sm: 12px;
  --tab-h: 58px;
  --header-h: 56px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
html { height: 100%; }
body {
  min-height: 100%;
  min-height: 100dvh;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: var(--orange); }
img { max-width: 100%; }
input, textarea, select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 11px 12px;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--orange);
  box-shadow: 0 0 0 3px rgba(232, 108, 42, 0.18);
}
textarea { min-height: 88px; resize: vertical; }
label.fld { display: block; margin: 0 0 12px; }
label.fld > span, .fld-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.02em;
  margin: 0 0 6px;
}
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.app {
  min-height: 100dvh;
  padding-top: calc(var(--safe-t) + var(--header-h));
  padding-bottom: calc(var(--safe-b) + var(--tab-h) + 10px);
  padding-left: var(--safe-l);
  padding-right: var(--safe-r);
}
.app.editor-open { padding-bottom: calc(var(--safe-b) + 88px); }
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 20;
  height: calc(var(--safe-t) + var(--header-h));
  padding: var(--safe-t) 16px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: rgba(243, 239, 233, 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.topbar h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 760;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-mark {
  width: 28px; height: 28px;
  border-radius: 7px;
  background: url("icon-180.png") center/cover no-repeat;
  flex: 0 0 auto;
}
.icon-btn {
  width: 40px; height: 40px;
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  background: transparent;
}
.icon-btn:active { background: var(--line); }
.icon-btn.accent {
  background: var(--orange);
  color: #fff;
  width: 36px; height: 36px;
  box-shadow: 0 6px 16px rgba(196, 81, 26, 0.28);
}
.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 20;
  height: calc(var(--tab-h) + var(--safe-b));
  padding: 6px 8px var(--safe-b);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
}
.tabbar button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--text-dim);
  font-size: 10px;
  font-weight: 600;
  padding: 4px 0 0;
  border-radius: 10px;
}
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button.active { color: var(--orange); }
.page { padding: 14px 16px 24px; max-width: 720px; margin: 0 auto; }
.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.summary .card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px 14px 12px;
  box-shadow: var(--shadow);
}
.summary .k { font-size: 12px; color: var(--text-dim); font-weight: 600; }
.summary .v { font-size: 22px; font-weight: 750; letter-spacing: -0.03em; margin-top: 2px; }
.summary .card.due .v { color: var(--red); }
.summary .card.paid .v { color: var(--green); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 12px; -webkit-overflow-scrolling: touch; }
.chip {
  flex: 0 0 auto;
  padding: 7px 12px;
  border-radius: 999px;
  background: rgba(28,25,23,0.06);
  color: var(--text);
  font-size: 13px;
  font-weight: 650;
}
.chip.active { background: var(--text); color: #fff; }
.search {
  margin: 0 0 12px;
  position: relative;
}
.search input { padding-left: 36px; background: var(--surface); }
.search svg {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--text-dim); pointer-events: none;
}
.list { display: flex; flex-direction: column; gap: 8px; }
.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  text-align: left;
  width: 100%;
}
.doc-card { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.doc-card .num { font-weight: 750; font-size: 15px; }
.doc-card .who { color: var(--text); margin-top: 2px; }
.doc-card .meta { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
.doc-card .amt { font-weight: 750; font-variant-numeric: tabular-nums; text-align: right; }
.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 999px;
  margin-top: 6px;
}
.badge.draft { background: rgba(28,25,23,0.08); color: var(--text-dim); }
.badge.sent { background: var(--blue-soft); color: var(--blue); }
.badge.paid { background: var(--green-soft); color: var(--green); }
.badge.overdue { background: var(--red-soft); color: var(--red); }
.badge.converted { background: var(--amber-soft); color: var(--amber); }
.empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-dim);
}
.empty h2 { color: var(--text); font-size: 20px; margin: 0 0 8px; }
.empty p { margin: 0 0 18px; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 16px;
  border-radius: 12px;
  font-weight: 700;
  background: var(--orange);
  color: #fff;
  box-shadow: 0 6px 16px rgba(196, 81, 26, 0.22);
}
.btn:active { transform: translateY(1px); }
.btn.secondary {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--line);
  box-shadow: none;
}
.btn.ghost { background: transparent; color: var(--orange); box-shadow: none; padding: 8px 10px; }
.btn.danger { background: var(--red); box-shadow: none; }
.btn.block { width: 100%; }
.btn.small { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.person, .item-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.person .sub, .item-row .sub { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
.item-row .rate { font-weight: 700; font-variant-numeric: tabular-nums; }
.settings-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 14px;
}
.settings-card h2 { margin: 0 0 12px; font-size: 16px; }
.logo-row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.logo-preview {
  width: 72px; height: 72px;
  border-radius: 12px;
  border: 1px dashed var(--line);
  background: #fafafa;
  object-fit: contain;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-dim); font-size: 11px; text-align: center;
  overflow: hidden;
  flex: 0 0 auto;
}
.logo-preview img { width: 100%; height: 100%; object-fit: contain; }
.hint { font-size: 13px; color: var(--text-dim); margin: 8px 0 0; }
.help-steps { margin: 0; padding-left: 18px; color: var(--text-dim); font-size: 14px; }
.help-steps li { margin: 0 0 6px; }

/* Editor */
.editor-top {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 30;
  padding: var(--safe-t) 8px 0;
  height: calc(var(--safe-t) + 96px);
  background: rgba(243, 239, 233, 0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}
.editor-nav {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.editor-nav .title {
  font-weight: 750;
  font-size: 16px;
}
.mode-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 4px;
  margin: 0 10px;
  background: rgba(28,25,23,0.06);
  border-radius: 10px;
  padding: 3px;
}
.mode-tabs button {
  padding: 7px 8px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-dim);
}
.mode-tabs button.active { background: #fff; color: var(--text); box-shadow: 0 1px 4px rgba(28,25,23,0.08); }
.app.editor-open { padding-top: calc(var(--safe-t) + 96px); }
.editor-actions {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  padding: 10px 16px calc(10px + var(--safe-b));
  background: rgba(243, 239, 233, 0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.form-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  margin-bottom: 12px;
}
.form-card h3 {
  margin: 0 0 12px;
  font-size: 13px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.client-pick {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  width: 100%;
  text-align: left;
  margin-bottom: 10px;
}
.client-pick strong { display: block; }
.client-pick span { color: var(--text-dim); font-size: 13px; }
.line {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 8px;
  background: #fff;
}
.line-top { display: flex; gap: 8px; align-items: flex-start; }
.line-top textarea, .line-top input { min-height: 0; }
.line .desc { flex: 1; min-height: 44px; }
.line-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
.line-amt {
  display: flex; align-items: flex-end; justify-content: flex-end;
  font-weight: 700; font-variant-numeric: tabular-nums;
  padding-bottom: 10px;
}
.line-remove { color: var(--red); width: 36px; height: 36px; flex: 0 0 auto; }
.totals-box { margin-top: 4px; }
.totals-box .trow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  font-variant-numeric: tabular-nums;
}
.totals-box .trow.grand {
  border-top: 2px solid var(--text);
  margin-top: 4px;
  padding-top: 10px;
  font-size: 18px;
  font-weight: 750;
}
.disc-row { display: grid; grid-template-columns: 90px 1fr; gap: 8px; }

/* Preview paper */
.preview-wrap {
  background: #ddd6cc;
  margin: -14px -16px 0;
  padding: 14px 12px 28px;
  min-height: 60vh;
}
.inv-paper {
  background: #fff;
  color: #1a1a1a;
  padding: 22px 18px 20px;
  border-radius: 4px;
  box-shadow: 0 12px 32px rgba(28,25,23,0.16);
  position: relative;
  max-width: 640px;
  margin: 0 auto;
}
.inv-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.inv-brand { display: flex; gap: 12px; align-items: flex-start; min-width: 0; flex: 1; }
.inv-logo { max-height: 64px; max-width: 140px; object-fit: contain; }
.inv-biz-name { font-weight: 750; font-size: 17px; line-height: 1.25; }
.inv-biz-meta { color: #5c5854; font-size: 11.5px; line-height: 1.45; margin-top: 4px; white-space: pre-line; }
.inv-titleblock { text-align: right; flex: 0 0 auto; }
.inv-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.1em;
  color: #1C6B4A;
  line-height: 1;
}
.inv-num { font-weight: 750; margin: 6px 0 8px; font-size: 14px; }
.inv-dates { color: #5c5854; font-size: 12px; line-height: 1.5; }
.inv-billto { margin-top: 22px; }
.inv-label {
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0.1em;
  color: #1C6B4A;
  margin-bottom: 4px;
}
.inv-billto .name { font-weight: 750; font-size: 14px; }
.inv-billto .meta { color: #5c5854; font-size: 12px; white-space: pre-line; }
.inv-items { width: 100%; border-collapse: collapse; margin-top: 20px; }
.inv-items th {
  background: #1C6B4A;
  color: #fff;
  font-weight: 650;
  font-size: 11px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 8px 8px;
}
.inv-items th:first-child { text-align: left; border-radius: 4px 0 0 0; }
.inv-items th:nth-child(2),
.inv-items th:nth-child(3),
.inv-items th:nth-child(4) { text-align: right; }
.inv-items th:last-child { border-radius: 0 4px 0 0; }
.inv-items td { padding: 8px; border-bottom: 1px solid #e8e6e1; font-size: 12.5px; vertical-align: top; }
.inv-items td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.inv-bottom { display: flex; gap: 16px; margin-top: 18px; align-items: flex-start; }
.inv-notes { flex: 1; min-width: 0; font-size: 12px; color: #5c5854; }
.inv-notes .body { white-space: pre-line; margin-top: 4px; color: #1a1a1a; }
.inv-pay { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; }
.inv-qr { width: 88px; height: 88px; flex: 0 0 auto; }
.inv-qr canvas, .inv-qr img { width: 88px; height: 88px; display: block; }
.inv-totals { width: 200px; flex: 0 0 auto; font-size: 13px; }
.inv-totals .trow { display: flex; justify-content: space-between; padding: 3px 0; font-variant-numeric: tabular-nums; }
.inv-totals .grand {
  border-top: 2px solid #1C6B4A;
  margin-top: 6px;
  padding-top: 8px;
  font-weight: 800;
  font-size: 15px;
  color: #1C6B4A;
}
.inv-foot {
  margin-top: 28px;
  padding-top: 10px;
  border-top: 1px solid #eee;
  font-size: 11px;
  color: #8a8580;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.inv-stamp {
  position: absolute;
  right: 22px;
  top: 118px;
  border: 3px solid #1C6B4A;
  color: #1C6B4A;
  font-weight: 800;
  letter-spacing: 0.14em;
  padding: 5px 12px;
  transform: rotate(-14deg);
  border-radius: 6px;
  opacity: 0.82;
  font-size: 20px;
  pointer-events: none;
}
.inv-stamp.overdue { border-color: #C0392B; color: #C0392B; }
#pdf-root {
  position: fixed;
  left: -12000px;
  top: 0;
  width: 794px;
  background: #fff;
  pointer-events: none;
  z-index: -1;
}
#pdf-root .inv-paper {
  width: 794px;
  min-height: 1123px;
  padding: 48px 52px 44px;
  border-radius: 0;
  box-shadow: none;
  max-width: none;
}
#pdf-root .inv-logo { max-height: 80px; max-width: 200px; }
#pdf-root .inv-biz-name { font-size: 22px; }
#pdf-root .inv-biz-meta { font-size: 12.5px; }
#pdf-root .inv-title { font-size: 32px; }
#pdf-root .inv-num { font-size: 16px; }
#pdf-root .inv-dates, #pdf-root .inv-billto .meta { font-size: 13px; }
#pdf-root .inv-billto .name { font-size: 16px; }
#pdf-root .inv-items th { font-size: 12px; padding: 10px 12px; }
#pdf-root .inv-items td { font-size: 13.5px; padding: 10px 12px; }
#pdf-root .inv-totals { width: 260px; font-size: 14px; }
#pdf-root .inv-totals .grand { font-size: 18px; }
#pdf-root .inv-notes { font-size: 13px; }
#pdf-root .inv-qr, #pdf-root .inv-qr canvas, #pdf-root .inv-qr img { width: 112px; height: 112px; }
#pdf-root .inv-stamp { right: 56px; top: 150px; font-size: 28px; padding: 8px 16px; }
#pdf-root .inv-foot { font-size: 12px; margin-top: 40px; }

.history { padding: 6px 0 20px; }
.hist-item {
  display: grid;
  grid-template-columns: 16px 1fr;
  gap: 10px;
  padding: 0 0 16px;
  position: relative;
}
.hist-item:before {
  content: "";
  position: absolute;
  left: 7px; top: 16px; bottom: 0;
  width: 2px;
  background: var(--line);
}
.hist-item:last-child:before { display: none; }
.dot {
  width: 16px; height: 16px;
  border-radius: 8px;
  background: var(--orange);
  margin-top: 2px;
}
.hist-item .when { color: var(--text-dim); font-size: 12px; margin-top: 2px; }

/* Sheets */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(20, 16, 12, 0.45);
  z-index: 40;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet {
  background: var(--surface);
  width: 100%;
  max-width: 560px;
  max-height: min(90dvh, 720px);
  border-radius: 20px 20px 0 0;
  padding: 8px 16px calc(16px + var(--safe-b));
  overflow: auto;
  animation: slideup .25s ease;
}
@keyframes slideup {
  from { transform: translateY(24px); opacity: 0.6; }
  to { transform: none; opacity: 1; }
}
.sheet-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: rgba(28,25,23,0.18);
  margin: 6px auto 12px;
}
.sheet h2 { margin: 0 0 12px; font-size: 18px; }
.menu-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  text-align: left;
  padding: 14px 4px;
  border-bottom: 1px solid var(--line);
  font-weight: 650;
}
.menu-item:last-child { border-bottom: 0; }
.menu-item.danger { color: var(--red); }
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tab-h) + var(--safe-b) + 16px);
  transform: translateX(-50%) translateY(8px);
  background: #1C1917;
  color: #fff;
  padding: 10px 16px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  max-width: calc(100% - 32px);
  text-align: center;
  transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#busy {
  position: fixed; inset: 0;
  background: rgba(243, 239, 233, 0.72);
  z-index: 70;
  display: flex; align-items: center; justify-content: center;
}
#busy[hidden] { display: none; }
.busy-card {
  background: #fff;
  padding: 18px 22px;
  border-radius: 16px;
  box-shadow: var(--shadow);
  font-weight: 700;
}
.picker-row {
  width: 100%;
  text-align: left;
  padding: 12px 4px;
  border-bottom: 1px solid var(--line);
}
.picker-row .sub { color: var(--text-dim); font-size: 13px; }
@media (max-width: 640px) {
  #preview-wrap .inv-bottom {
    flex-direction: column;
    gap: 14px;
  }
  #preview-wrap .inv-totals {
    width: 100%;
    max-width: 230px;
    margin-left: auto;
  }
}
@media (min-width: 700px) {
  .inv-paper { padding: 36px 34px 32px; }
  .inv-title { font-size: 28px; }
}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="busy" hidden><div class="busy-card">Preparing PDF…</div></div>
  <div id="pdf-root" aria-hidden="true"></div>
  <script>

(function () {
  'use strict';

  var KEY = 'invoices-app-v1';
  var state, ui;
  var toastTimer;

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function defaultSettings() {
    return {
      businessName: '',
      logo: '',
      address: '',
      phone: '',
      email: '',
      gstNumber: '',
      taxRate: 5,
      taxLabel: 'GST',
      currency: 'CAD',
      paymentNotes: '',
      defaultDueDays: 30,
      invoicePrefix: 'INV',
      nextInvoiceNumber: 1,
      estimatePrefix: 'EST',
      nextEstimateNumber: 1
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) {
        return { version: 1, settings: defaultSettings(), clients: [], items: [], docs: [] };
      }
      var data = JSON.parse(raw);
      data.settings = Object.assign(defaultSettings(), data.settings || {});
      data.clients = data.clients || [];
      data.items = data.items || [];
      data.docs = data.docs || data.invoices || [];
      data.version = 1;
      return data;
    } catch (err) {
      console.error(err);
      return { version: 1, settings: defaultSettings(), clients: [], items: [], docs: [] };
    }
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      return true;
    } catch (err) {
      console.error(err);
      toast('Could not save — storage may be full. Try a smaller logo.');
      return false;
    }
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function addDays(iso, days) {
    var p = (iso || todayISO()).split('-').map(Number);
    var dt = new Date(p[0], p[1] - 1, p[2]);
    dt.setDate(dt.getDate() + Number(days || 0));
    return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
  }

  function fmtDate(iso) {
    if (!iso) return '';
    var p = iso.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('en-CA', {
      year: 'numeric', month: 'short', day: 'numeric'
    });
  }

  function fmtDateTime(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleString('en-CA', {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit'
    });
  }

  function money(n) {
    var cur = (state && state.settings && state.settings.currency) || 'CAD';
    try {
      return new Intl.NumberFormat('en-CA', { style: 'currency', currency: cur }).format(Number(n) || 0);
    } catch (e) {
      return '$' + (Number(n) || 0).toFixed(2);
    }
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function lineAmount(line) {
    var qty = Number(line.qty) || 0;
    var rate = Number(line.rate) || 0;
    return Math.round(qty * rate * 100) / 100;
  }

  function compute(doc) {
    var subtotal = (doc.lines || []).reduce(function (s, l) { return s + lineAmount(l); }, 0);
    subtotal = Math.round(subtotal * 100) / 100;
    var discount = Number(doc.discount) || 0;
    if (doc.discountType === 'percent') discount = subtotal * (discount / 100);
    discount = Math.min(Math.max(discount, 0), subtotal);
    discount = Math.round(discount * 100) / 100;
    var taxable = Math.round((subtotal - discount) * 100) / 100;
    var rate = doc.taxRate != null && doc.taxRate !== '' ? Number(doc.taxRate) : Number(state.settings.taxRate) || 0;
    var tax = Math.round(taxable * (rate / 100) * 100) / 100;
    var total = Math.round((taxable + tax) * 100) / 100;
    return { subtotal: subtotal, discount: discount, tax: tax, total: total, taxable: taxable, rate: rate };
  }

  function effectiveStatus(doc) {
    if (doc.status === 'paid' || doc.status === 'converted') return doc.status;
    if (doc.type !== 'estimate' && doc.dueDate && doc.dueDate < todayISO() && doc.status !== 'paid') return 'overdue';
    return doc.status || 'draft';
  }

  function statusLabel(s) {
    return ({ draft: 'Draft', sent: 'Sent', paid: 'Paid', overdue: 'Overdue', converted: 'Converted' })[s] || s;
  }

  function getDoc(id) {
    return state.docs.find(function (d) { return d.id === id; });
  }

  function getClient(id) {
    return state.clients.find(function (c) { return c.id === id; });
  }

  function formatNumber(prefix, n) {
    return (prefix || '') + String(n).padStart(4, '0');
  }

  function nextNumber(type) {
    if (type === 'estimate') {
      var n = state.settings.nextEstimateNumber || 1;
      state.settings.nextEstimateNumber = n + 1;
      return formatNumber(state.settings.estimatePrefix || 'EST', n);
    }
    var m = state.settings.nextInvoiceNumber || 1;
    state.settings.nextInvoiceNumber = m + 1;
    return formatNumber(state.settings.invoicePrefix || 'INV', m);
  }

  function pushHistory(doc, action, detail) {
    doc.history = doc.history || [];
    doc.history.push({ at: new Date().toISOString(), action: action, detail: detail || '' });
    doc.updatedAt = new Date().toISOString();
  }

  function newDoc(type) {
    var date = todayISO();
    var due = addDays(date, state.settings.defaultDueDays || 30);
    var doc = {
      id: uid(),
      type: type === 'estimate' ? 'estimate' : 'invoice',
      number: nextNumber(type),
      date: date,
      dueDate: due,
      clientId: '',
      billTo: { name: '', email: '', phone: '', address: '' },
      lines: [{ id: uid(), description: '', qty: 1, rate: 0 }],
      discountType: 'amount',
      discount: 0,
      taxRate: state.settings.taxRate,
      taxLabel: state.settings.taxLabel || 'GST',
      notes: '',
      status: 'draft',
      paidDate: '',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      history: [{ at: new Date().toISOString(), action: 'Created' }]
    };
    state.docs.unshift(doc);
    save();
    return doc;
  }

  function duplicateDoc(doc) {
    var copy = JSON.parse(JSON.stringify(doc));
    copy.id = uid();
    copy.number = nextNumber(doc.type);
    copy.date = todayISO();
    copy.dueDate = addDays(copy.date, state.settings.defaultDueDays || 30);
    copy.status = 'draft';
    copy.paidDate = '';
    copy.createdAt = new Date().toISOString();
    copy.updatedAt = copy.createdAt;
    copy.lines = (copy.lines || []).map(function (l) {
      l.id = uid();
      return l;
    });
    copy.history = [{ at: copy.createdAt, action: 'Duplicated from ' + doc.number }];
    state.docs.unshift(copy);
    save();
    return copy;
  }

  function convertEstimate(est) {
    var created = newDoc('invoice');
    created.billTo = JSON.parse(JSON.stringify(est.billTo || {}));
    created.clientId = est.clientId || '';
    created.lines = (est.lines || []).map(function (l) {
      return { id: uid(), description: l.description, qty: l.qty, rate: l.rate };
    });
    if (!created.lines.length) created.lines = [{ id: uid(), description: '', qty: 1, rate: 0 }];
    created.discountType = est.discountType;
    created.discount = est.discount;
    created.taxRate = est.taxRate;
    created.taxLabel = est.taxLabel;
    created.notes = est.notes;
    created.history = [
      { at: created.createdAt, action: 'Converted from estimate ' + est.number }
    ];
    est.status = 'converted';
    pushHistory(est, 'Converted to invoice ' + created.number);
    save();
    return created;
  }

  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }

  function showBusy(msg) {
    var el = document.getElementById('busy');
    el.querySelector('.busy-card').textContent = msg || 'Please wait…';
    el.hidden = false;
  }

  function hideBusy() {
    document.getElementById('busy').hidden = true;
  }

  function closeSheet() {
    ui.sheet = null;
    document.getElementById('sheet-root').innerHTML = '';
  }

  function openSheet(type, extra) {
    ui.sheet = Object.assign({ type: type }, extra || {});
    renderSheet();
  }

  function svgSearch() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>';
  }

  function tabIcon(name) {
    if (name === 'invoices') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>';
    if (name === 'clients') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 19c.8-3 3.3-4.5 6.5-4.5s5.7 1.5 6.5 4.5"/></svg>';
    if (name === 'items') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></svg>';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"/></svg>';
  }

  function filteredDocs() {
    var q = (ui.search || '').trim().toLowerCase();
    return state.docs.filter(function (d) {
      var st = effectiveStatus(d);
      if (ui.filter === 'outstanding') {
        if (d.type === 'estimate') return false;
        if (st === 'paid' || st === 'converted') return false;
      } else if (ui.filter === 'paid') {
        if (d.type === 'estimate' || st !== 'paid') return false;
      } else if (ui.filter === 'estimates') {
        if (d.type !== 'estimate') return false;
      }
      if (!q) return true;
      var name = (d.billTo && d.billTo.name) || '';
      return (d.number + ' ' + name + ' ' + (d.notes || '')).toLowerCase().indexOf(q) !== -1;
    });
  }

  function outstandingTotal() {
    return state.docs.reduce(function (s, d) {
      if (d.type === 'estimate') return s;
      var st = effectiveStatus(d);
      if (st === 'paid' || st === 'converted') return s;
      return s + compute(d).total;
    }, 0);
  }

  function paidTotal() {
    return state.docs.reduce(function (s, d) {
      if (d.type === 'estimate') return s;
      if (effectiveStatus(d) !== 'paid') return s;
      return s + compute(d).total;
    }, 0);
  }

  function render() {
    var app = document.getElementById('app');
    if (ui.editingId && getDoc(ui.editingId)) {
      app.className = 'app editor-open';
      app.innerHTML = renderEditor(getDoc(ui.editingId));
      if (ui.editorMode === 'preview') drawPreviewQr();
    } else {
      ui.editingId = ui.editingId && getDoc(ui.editingId) ? ui.editingId : null;
      app.className = 'app';
      var body = '';
      if (ui.tab === 'clients') body = renderClients();
      else if (ui.tab === 'items') body = renderItems();
      else if (ui.tab === 'settings') body = renderSettings();
      else body = renderInvoices();
      app.innerHTML = renderTopbar() + '<div class="page">' + body + '</div>' + renderTabbar();
    }
    if (ui.sheet) renderSheet();
  }

  function renderTopbar() {
    var title = ({ invoices: 'Invoices', clients: 'Clients', items: 'Items', settings: 'Settings' })[ui.tab] || 'Invoices';
    var add = ui.tab === 'settings' ? '' :
      '<button class="icon-btn accent" data-act="add" aria-label="Add">+</button>';
    return '<div class="topbar"><h1><span class="brand-mark" aria-hidden="true"></span>' + title + '</h1>' + add + '</div>';
  }

  function renderTabbar() {
    return '<nav class="tabbar">' + ['invoices', 'clients', 'items', 'settings'].map(function (t) {
      var label = t[0].toUpperCase() + t.slice(1);
      return '<button class="' + (ui.tab === t ? 'active' : '') + '" data-act="tab" data-tab="' + t + '">' + tabIcon(t) + label + '</button>';
    }).join('') + '</nav>';
  }

  function renderInvoices() {
    var docs = filteredDocs();
    var html = '<div class="summary">' +
      '<div class="card due"><div class="k">Outstanding</div><div class="v">' + esc(money(outstandingTotal())) + '</div></div>' +
      '<div class="card paid"><div class="k">Paid</div><div class="v">' + esc(money(paidTotal())) + '</div></div>' +
      '</div>' +
      '<div class="chips">' +
        chip('outstanding', 'Outstanding') + chip('paid', 'Paid') + chip('all', 'All') + chip('estimates', 'Estimates') +
      '</div>' +
      '<div class="search">' + svgSearch() +
      '<input type="search" placeholder="Search invoices" value="' + esc(ui.search || '') + '" data-role="search" enterkeyhint="search"></div>';
    if (!state.docs.length) {
      html += '<div class="empty"><h2>No invoices yet</h2><p>Create an invoice, preview it, and send a PDF from your iPhone.</p>' +
        '<button class="btn" data-act="add">New invoice</button></div>';
      if (!state.settings.businessName) {
        html += '<p class="hint" style="text-align:center">Tip: add your business name and logo in Settings first, so they appear on every invoice.</p>';
      }
      return html;
    }
    if (!docs.length) {
      html += '<div class="empty"><p>Nothing in this list yet.</p></div>';
      return html;
    }
    html += '<div class="list">';
    docs.forEach(function (d) {
      var st = effectiveStatus(d);
      var t = compute(d);
      var due = d.type === 'estimate'
        ? (d.dueDate ? 'Valid until ' + fmtDate(d.dueDate) : '')
        : (d.dueDate ? (st === 'paid' && d.paidDate ? 'Paid ' + fmtDate(d.paidDate) : 'Due ' + fmtDate(d.dueDate)) : '');
      html += '<button class="card doc-card" data-act="open-doc" data-id="' + d.id + '">' +
        '<div><div class="num">' + esc(d.number) + '</div>' +
        '<div class="who">' + esc((d.billTo && d.billTo.name) || 'No client') + '</div>' +
        '<div class="meta">' + esc(fmtDate(d.date) + (due ? ' · ' + due : '')) + '</div>' +
        '<span class="badge ' + st + '">' + statusLabel(st) + '</span></div>' +
        '<div class="amt">' + esc(money(t.total)) + '</div></button>';
    });
    html += '</div>';
    return html;
  }

  function chip(id, label) {
    return '<button class="chip' + (ui.filter === id ? ' active' : '') + '" data-act="filter" data-filter="' + id + '">' + label + '</button>';
  }

  function renderClients() {
    var q = (ui.search || '').trim().toLowerCase();
    var list = state.clients.filter(function (c) {
      if (!q) return true;
      return (c.name + ' ' + (c.email || '') + ' ' + (c.phone || '')).toLowerCase().indexOf(q) !== -1;
    });
    var html = '<div class="search">' + svgSearch() +
      '<input type="search" placeholder="Search clients" value="' + esc(ui.search || '') + '" data-role="search"></div>';
    if (!state.clients.length) {
      return html + '<div class="empty"><h2>No clients yet</h2><p>Save a client to reuse their details on invoices.</p>' +
        '<button class="btn" data-act="add">Add client</button></div>';
    }
    html += '<div class="list">';
    list.forEach(function (c) {
      html += '<button class="card person" data-act="edit-client" data-id="' + c.id + '"><div>' +
        '<div class="num">' + esc(c.name || 'Untitled') + '</div>' +
        '<div class="sub">' + esc([c.email, c.phone].filter(Boolean).join(' · ') || 'No contact details') + '</div>' +
        '</div></button>';
    });
    html += '</div>';
    return html;
  }

  function renderItems() {
    var q = (ui.search || '').trim().toLowerCase();
    var list = state.items.filter(function (it) {
      if (!q) return true;
      return (it.description || '').toLowerCase().indexOf(q) !== -1;
    });
    var html = '<div class="search">' + svgSearch() +
      '<input type="search" placeholder="Search items" value="' + esc(ui.search || '') + '" data-role="search"></div>';
    if (!state.items.length) {
      return html + '<div class="empty"><h2>No saved items</h2><p>Save work you bill often, then add it to an invoice in one tap.</p>' +
        '<button class="btn" data-act="add">Add item</button></div>';
    }
    html += '<div class="list">';
    list.forEach(function (it) {
      html += '<button class="card item-row" data-act="edit-item" data-id="' + it.id + '"><div>' +
        '<div class="num">' + esc(it.description || 'Untitled') + '</div></div>' +
        '<div class="rate">' + esc(money(it.rate)) + '</div></button>';
    });
    html += '</div>';
    return html;
  }

  function renderSettings() {
    var s = state.settings;
    var logo = s.logo
      ? '<div class="logo-preview"><img src="' + esc(s.logo) + '" alt="Business logo"></div>'
      : '<div class="logo-preview">Logo</div>';
    return '' +
      '<div class="settings-card"><h2>Business</h2>' +
        '<div class="logo-row">' + logo + '<div>' +
          '<button class="btn secondary small" data-act="pick-logo">Upload logo</button> ' +
          (s.logo ? '<button class="btn ghost small" data-act="clear-logo">Remove</button>' : '') +
          '<input id="logo-file" type="file" accept="image/*" hidden>' +
          '<p class="hint">Shown at the top of every invoice.</p>' +
        '</div></div>' +
        field('Business name', 'settings.businessName', s.businessName, 'text') +
        field('Address', 'settings.address', s.address, 'textarea') +
        field('Phone', 'settings.phone', s.phone, 'tel') +
        field('Email', 'settings.email', s.email, 'email') +
        field('GST number', 'settings.gstNumber', s.gstNumber, 'text') +
      '</div>' +
      '<div class="settings-card"><h2>Tax & currency</h2>' +
        '<div class="row-2">' + field('Tax label', 'settings.taxLabel', s.taxLabel, 'text') +
        field('Tax rate (%)', 'settings.taxRate', s.taxRate, 'number') + '</div>' +
        field('Currency', 'settings.currency', s.currency, 'text') +
        '<p class="hint">Alberta GST is 5%. Change the rate if you charge something else.</p>' +
      '</div>' +
      '<div class="settings-card"><h2>Payments & defaults</h2>' +
        field('Payment instructions', 'settings.paymentNotes', s.paymentNotes, 'textarea') +
        field('Default due days', 'settings.defaultDueDays', s.defaultDueDays, 'number') +
        '<div class="row-2">' + field('Invoice prefix', 'settings.invoicePrefix', s.invoicePrefix, 'text') +
        field('Next invoice #', 'settings.nextInvoiceNumber', s.nextInvoiceNumber, 'number') + '</div>' +
        '<div class="row-2">' + field('Estimate prefix', 'settings.estimatePrefix', s.estimatePrefix, 'text') +
        field('Next estimate #', 'settings.nextEstimateNumber', s.nextEstimateNumber, 'number') + '</div>' +
      '</div>' +
      '<div class="settings-card"><h2>Backup</h2>' +
        '<p class="hint" style="margin-top:0">Your invoices are saved only on this phone. Export a backup JSON file, and import it to restore or copy them to another device.</p>' +
        '<button class="btn secondary block" data-act="export-json" style="margin-bottom:8px">Export backup</button>' +
        '<button class="btn secondary block" data-act="import-json">Import backup</button>' +
        '<input id="import-file" type="file" accept="application/json,.json" hidden>' +
      '</div>' +
      '<div class="settings-card"><h2>Add to Home Screen</h2>' +
        '<ol class="help-steps"><li>Open this page in Safari.</li><li>Tap the Share button, then Add to Home Screen.</li><li>Tap Add. The orange checkmark icon will appear on your Home Screen.</li></ol>' +
      '</div>' +
      '<p class="hint" style="text-align:center;margin-bottom:20px">Data stays on this device. Nothing is uploaded to a server.</p>';
  }

  function field(label, bind, value, type) {
    var inner;
    if (type === 'textarea') {
      inner = '<textarea data-bind="' + bind + '" rows="3">' + esc(value || '') + '</textarea>';
    } else {
      var extra = type === 'number' ? ' inputmode="decimal"' : '';
      inner = '<input type="' + type + '" data-bind="' + bind + '" value="' + esc(value == null ? '' : value) + '"' + extra + '>';
    }
    return '<label class="fld"><span>' + esc(label) + '</span>' + inner + '</label>';
  }

  function renderEditor(doc) {
    var st = effectiveStatus(doc);
    var title = esc(doc.number);
    var more = '<button class="icon-btn" data-act="doc-menu" aria-label="More">•••</button>';
    var back = '<button class="icon-btn" data-act="close-editor" aria-label="Back">‹</button>';
    var tabs = '<div class="mode-tabs">' +
      modeTab('edit', 'Edit') + modeTab('preview', 'Preview') + modeTab('history', 'History') +
      '</div>';
    var body = ui.editorMode === 'preview' ? renderPreview(doc)
      : ui.editorMode === 'history' ? renderHistory(doc)
      : renderEditForm(doc);
    var actions;
    if (doc.type === 'estimate') {
      if (doc.status === 'converted') {
        actions = '<button class="btn secondary" data-act="close-editor">Done</button>' +
          '<button class="btn" data-act="send-doc">Send PDF</button>';
      } else {
        actions = '<button class="btn secondary" data-act="convert-est">Convert to invoice</button>' +
          '<button class="btn" data-act="send-doc">Send PDF</button>';
      }
    } else if (st === 'paid') {
      actions = '<button class="btn secondary" data-act="send-doc">Send PDF</button>' +
        '<button class="btn secondary" data-act="close-editor">Done</button>';
    } else {
      actions = '<button class="btn secondary" data-act="mark-paid">Mark paid</button>' +
        '<button class="btn" data-act="send-doc">Send invoice</button>';
    }
    return '<div class="editor-top"><div class="editor-nav">' + back + '<div class="title">' + title +

  function drawQr(el, text) {
    if (!el) return Promise.resolve();
    el.innerHTML = '';
    if (!text || typeof QRCode !== 'function') return Promise.resolve();
    try {
      var size = el.clientWidth || 112;
      new QRCode(el, {
        text: text,
        width: size,
        height: size,
        colorDark: '#1a1a1a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (err) {
      console.error(err);
    }
    return Promise.resolve();
  }

  function setBind(path, value) {
    var parts = path.split('.');
    if (parts[0] === 'settings') {
      var key = parts[1];
      if (key === 'taxRate' || key === 'defaultDueDays' || key === 'nextInvoiceNumber' || key === 'nextEstimateNumber') {
        state.settings[key] = value === '' ? '' : Number(value);
      } else {
        state.settings[key] = value;
      }
      save();
      return;
    }
    if (parts[0] === 'sheet' && ui.sheet) {
      var obj = ui.sheet[parts[1]];
      if (parts[1] === 'paidDate') ui.sheet.paidDate = value;
      else if (obj) {
        var k = parts[2];
        obj[k] = k === 'rate' ? (value === '' ? '' : Number(value)) : value;
      }
      return;
    }
    if (parts[0] === 'doc' && ui.editingId) {
      var doc = getDoc(ui.editingId);
      if (!doc) return;
      if (parts[1] === 'billTo') {
        doc.billTo = doc.billTo || {};
        doc.billTo[parts[2]] = value;
      } else if (parts[1] === 'discount' || parts[1] === 'taxRate') {
        doc[parts[1]] = value === '' ? 0 : Number(value);
      } else {
        doc[parts[1]] = value;
      }
      doc.updatedAt = new Date().toISOString();
      save();
      updateTotalsUI(doc);
    }
  }

  function resizeImage(file, max) {
    max = max || 800;
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var w = img.width, h = img.height;
        if (w > max || h > max) {
          var r = Math.min(max / w, max / h);
          w = Math.round(w * r);
          h = Math.round(h * r);
        }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        var mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
        resolve(c.toDataURL(mime, 0.88));
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('Could not read image'));
      };
      img.src = url;
    });
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function waitLibs() {
    return new Promise(function (resolve, reject) {
      var start = Date.now();
      (function tick() {
        var jsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
        if (window.html2canvas && jsPDF && typeof QRCode === "function") return resolve();
        if (Date.now() - start > 15000) return reject(new Error('PDF libraries failed to load'));
        setTimeout(tick, 50);
      })();
    });
  }

  function makePdf(doc) {
    return waitLibs().then(function () {
      var root = document.getElementById('pdf-root');
      root.innerHTML = renderPaper(doc, { pdf: true });
      return drawQr(root.querySelector('.inv-qr'), qrText(doc)).then(function () {
        var imgs = Array.prototype.slice.call(root.querySelectorAll('img'));
        return Promise.all(imgs.map(function (img) {
          if (img.complete) return Promise.resolve();
          return new Promise(function (res) { img.onload = img.onerror = res; });
        }));
      }).then(function () {
        return new Promise(function (r) { requestAnimationFrame(function () { setTimeout(r, 40); }); });
      }).then(function () {
        var paper = root.querySelector('.inv-paper');
        return html2canvas(paper, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff',
          logging: false
        });
      }).then(function (canvas) {
        var jsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
        var pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
        var pageW = 210, pageH = 297;
        var imgH = canvas.height * (pageW / canvas.width);
        var imgData = canvas.toDataURL('image/jpeg', 0.95);
        if (imgH <= pageH) {
          pdf.addImage(imgData, 'JPEG', 0, 0, pageW, imgH);
        } else {
          var pos = 0;
          var remaining = imgH;
          pdf.addImage(imgData, 'JPEG', 0, 0, pageW, imgH);
          remaining -= pageH;
          while (remaining > 0.5) {
            pos -= pageH;
            pdf.addPage();
            pdf.addImage(imgData, 'JPEG', 0, pos, pageW, imgH);
            remaining -= pageH;
          }
        }
        root.innerHTML = '';
        return pdf.output('blob');
      }).catch(function (err) {
        document.getElementById('pdf-root').innerHTML = '';
        throw err;
      });
    });
  }

  function markSent(doc) {
    if (doc.status === 'draft' || effectiveStatus(doc) === 'overdue' || doc.status === 'sent') {
      if (doc.status === 'draft') doc.status = 'sent';
      pushHistory(doc, 'Sent');
      save();
    }
  }

  function sendDoc(doc, opts) {
    opts = opts || {};
    showBusy('Preparing PDF…');
    return makePdf(doc).then(function (blob) {
      hideBusy();
      var filename = doc.number + '.pdf';
      if (opts.downloadOnly) {
        downloadBlob(blob, filename);
        toast('PDF downloaded');
        return blob;
      }
      var file = new File([blob], filename, { type: 'application/pdf' });
      var kind = doc.type === 'estimate' ? 'Estimate' : 'Invoice';
      var title = kind + ' ' + doc.number;
      var biz = state.settings.businessName || '';
      var t = compute(doc);
      var text = title + (biz ? ' from ' + biz : '') + '. Amount: ' + money(t.total) + '.';
      var shareAttempt = Promise.resolve(false);
      if (navigator.canShare) {
        try {
          if (navigator.canShare({ files: [file] })) {
            shareAttempt = navigator.share({ files: [file], title: title, text: text }).then(function () { return true; });
          }
        } catch (e) { /* fall through */ }
      }
      return shareAttempt.then(function (shared) {
        if (shared) {
          markSent(doc);
          render();
          toast('Marked as sent');
          return blob;
        }
        downloadBlob(blob, filename);
        var email = (doc.billTo && doc.billTo.email) || '';
        var subject = encodeURIComponent(title + (biz ? ' — ' + biz : ''));
        var first = (doc.billTo && doc.billTo.name) ? ' ' + doc.billTo.name.split(' ')[0] : '';
        var due = doc.dueDate ? '\n' + (doc.type === 'estimate' ? 'Valid until: ' : 'Due: ') + fmtDate(doc.dueDate) : '';
        var pay = state.settings.paymentNotes ? '\n\n' + state.settings.paymentNotes : '';
        var body = encodeURIComponent(
          'Hi' + first + ',\n\nPlease find ' + title + ' attached. If the PDF did not attach automatically, it has been saved to your device — attach ' + filename + ' to this message.\n\nAmount: ' + money(t.total) + due + pay + '\n\nThank you,' + (biz ? '\n' + biz : '')
        );
        window.location.href = 'mailto:' + email + '?subject=' + subject + '&body=' + body;
        markSent(doc);
        render();
        toast('PDF downloaded. Attach it to the email if needed.');
        return blob;
      }).catch(function (err) {
        if (err && err.name === 'AbortError') return blob;
        downloadBlob(blob, filename);
        markSent(doc);
        render();
        toast('PDF downloaded');
        return blob;
      });
    }).catch(function (err) {
      hideBusy();
      console.error(err);
      toast('Could not create the PDF. Check your connection and try again.');
      throw err;
    });
  }

  function onAdd() {
    if (ui.tab === 'clients') {
      openSheet('client-form', { client: { name: '', email: '', phone: '', address: '' } });
    } else if (ui.tab === 'items') {
      openSheet('item-form', { item: { description: '', rate: 0 } });
    } else {
      openSheet('new-type');
    }
  }

  function handleAct(act, btn, ev) {
    if (act === 'tab') {
      ui.tab = btn.getAttribute('data-tab');
      ui.editingId = null;
      ui.search = '';
      closeSheet();
      render();
      return;
    }
    if (act === 'filter') { ui.filter = btn.getAttribute('data-filter'); render(); return; }
    if (act === 'add') { onAdd(); return; }
    if (act === 'close-sheet' || (act === 'backdrop' && ev.target === btn)) { closeSheet(); return; }
    if (act === 'create-doc') {
      var created = newDoc(btn.getAttribute('data-type'));
      closeSheet();
      ui.editingId = created.id;
      ui.editorMode = 'edit';
      render();
      return;
    }
    if (act === 'open-doc') {
      ui.editingId = btn.getAttribute('data-id');
      ui.editorMode = 'preview';
      render();
      return;
    }
    if (act === 'close-editor') { ui.editingId = null; render(); return; }
    if (act === 'editor-tab') { ui.editorMode = btn.getAttribute('data-mode'); render(); return; }
    if (act === 'doc-menu') { openSheet('doc-menu'); return; }
    if (act === 'add-line') {
      var d = getDoc(ui.editingId);
      if (!d) return;
      d.lines.push({ id: uid(), description: '', qty: 1, rate: 0 });
      pushHistory(d, 'Edited');
      save();
      render();
      return;
    }
    if (act === 'remove-line') {
      var d2 = getDoc(ui.editingId);
      if (!d2) return;
      if ((d2.lines || []).length <= 1) {
        d2.lines[0] = { id: uid(), description: '', qty: 1, rate: 0 };
      } else {
        d2.lines = d2.lines.filter(function (l) { return l.id !== btn.getAttribute('data-id'); });
      }
      save();
      render();
      return;
    }
    if (act === 'add-saved-item') { openSheet('pick-item'); return; }
    if (act === 'use-item') {
      var item = state.items.find(function (x) { return x.id === btn.getAttribute('data-id'); });
      var d3 = getDoc(ui.editingId);
      if (item && d3) {
        var empty = d3.lines.find(function (l) { return !String(l.description || '').trim() && !lineAmount(l); });
        if (empty) {
          empty.description = item.description;
          empty.qty = empty.qty || 1;
          empty.rate = item.rate;
        } else {
          d3.lines.push({ id: uid(), description: item.description, qty: 1, rate: item.rate });
        }
        save();
      }
      closeSheet();
      render();
      return;
    }
    if (act === 'pick-client') { openSheet('pick-client'); return; }
    if (act === 'new-client-for-doc') {
      openSheet('client-form', { client: { name: '', email: '', phone: '', address: '' }, forDoc: true });
      return;
    }
    if (act === 'use-client') {
      var cl = getClient(btn.getAttribute('data-id'));
      var d4 = getDoc(ui.editingId);
      if (cl && d4) {
        d4.clientId = cl.id;
        d4.billTo = { name: cl.name || '', email: cl.email || '', phone: cl.phone || '', address: cl.address || '' };
        save();
      }
      closeSheet();
      render();
      return;
    }
    if (act === 'edit-client') {
      var cl2 = getClient(btn.getAttribute('data-id'));
      if (cl2) openSheet('client-form', { client: JSON.parse(JSON.stringify(cl2)) });
      return;
    }
    if (act === 'edit-item') {
      var it2 = state.items.find(function (x) { return x.id === btn.getAttribute('data-id'); });
      if (it2) openSheet('item-form', { item: JSON.parse(JSON.stringify(it2)) });
      return;
    }
    if (act === 'save-client') {
      var sc = ui.sheet && ui.sheet.client;
      if (!sc || !String(sc.name || '').trim()) { toast('Please enter a name'); return; }
      if (sc.id) {
        var existing = getClient(sc.id);
        if (existing) Object.assign(existing, sc);
      } else {
        sc.id = uid();
        state.clients.push(sc);
        if (ui.sheet.forDoc && ui.editingId) {
          var d5 = getDoc(ui.editingId);
          if (d5) {
            d5.clientId = sc.id;
            d5.billTo = { name: sc.name || '', email: sc.email || '', phone: sc.phone || '', address: sc.address || '' };
          }
        }
      }
      save();
      closeSheet();
      render();
      toast('Client saved');
      return;
    }
    if (act === 'save-item') {
      var si = ui.sheet && ui.sheet.item;
      if (!si || !String(si.description || '').trim()) { toast('Please enter a description'); return; }
      si.rate = Number(si.rate) || 0;
      if (si.id) {
        var exi = state.items.find(function (x) { return x.id === si.id; });
        if (exi) Object.assign(exi, si);
      } else {
        si.id = uid();
        state.items.push(si);
      }
      save();
      closeSheet();
      render();
      toast('Item saved');
      return;
    }
    if (act === 'ask-delete-client') {
      var cid = ui.sheet.client && ui.sheet.client.id;
      openSheet('confirm', {
        title: 'Delete this client?',
        body: 'Invoices already created keep their bill-to details.',
        ok: 'Delete',
        danger: true,
        fn: function () {
          state.clients = state.clients.filter(function (c) { return c.id !== cid; });
          save();
          closeSheet();
          render();
          toast('Client deleted');
        }
      });
      return;
    }
    if (act === 'ask-delete-item') {
      var iid = ui.sheet.item && ui.sheet.item.id;
      openSheet('confirm', {
        title: 'Delete this item?',
        body: 'Existing invoices are not changed.',
        ok: 'Delete',
        danger: true,
        fn: function () {
          state.items = state.items.filter(function (x) { return x.id !== iid; });
          save();
          closeSheet();
          render();
          toast('Item deleted');
        }
      });
      return;
    }
    if (act === 'ask-delete-doc') {
      var did = ui.editingId;
      openSheet('confirm', {
        title: 'Delete this invoice?',
        body: 'This cannot be undone.',
        ok: 'Delete',
        danger: true,
        fn: function () {
          state.docs = state.docs.filter(function (d) { return d.id !== did; });
          ui.editingId = null;
          save();
          closeSheet();
          render();
          toast('Deleted');
        }
      });
      return;
    }
    if (act === 'confirm-ok') {
      var fn = ui.sheet && ui.sheet.fn;
      if (fn) fn();
      return;
    }
    if (act === 'duplicate-doc') {
      var src = getDoc(ui.editingId);
      if (!src) return;
      var copy = duplicateDoc(src);
      closeSheet();
      ui.editingId = copy.id;
      ui.editorMode = 'edit';
      render();
      toast('Duplicated as ' + copy.number);
      return;
    }
    if (act === 'convert-est') {
      var est = getDoc(ui.editingId);
      if (!est) return;
      closeSheet();
      var inv = convertEstimate(est);
      ui.editingId = inv.id;
      ui.editorMode = 'edit';
      render();
      toast('Created invoice ' + inv.number);
      return;
    }
    if (act === 'mark-paid') {
      openSheet('mark-paid', { paidDate: todayISO() });
      return;
    }
    if (act === 'confirm-paid') {
      var d6 = getDoc(ui.editingId);
      if (!d6) return;
      d6.status = 'paid';
      d6.paidDate = ui.sheet.paidDate || todayISO();
      pushHistory(d6, 'Marked paid', fmtDate(d6.paidDate));
      save();
      closeSheet();
      render();
      toast('Marked as paid');
      return;
    }
    if (act === 'unpay') {
      var d7 = getDoc(ui.editingId);
      if (!d7) return;
      d7.status = 'sent';
      d7.paidDate = '';
      pushHistory(d7, 'Marked unpaid');
      save();
      closeSheet();
      render();
      return;
    }
    if (act === 'send-doc') {
      var d8 = getDoc(ui.editingId);
      if (d8) sendDoc(d8);
      return;
    }
    if (act === 'download-pdf') {
      var d9 = getDoc(ui.editingId);
      closeSheet();
      if (d9) sendDoc(d9, { downloadOnly: true });
      return;
    }
    if (act === 'pick-logo') {
      var lf = document.getElementById('logo-file');
      if (lf) lf.click();
      return;
    }
    if (act === 'clear-logo') {
      state.settings.logo = '';
      save();
      render();
      return;
    }
    if (act === 'export-json') {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      downloadBlob(blob, 'invoices-backup-' + todayISO() + '.json');
      toast('Backup exported');
      return;
    }
    if (act === 'import-json') {
      var imp = document.getElementById('import-file');
      if (imp) imp.click();
      return;
    }
  }

  function onClick(ev) {
    var btn = ev.target.closest('[data-act]');
    if (!btn) return;
    handleAct(btn.getAttribute('data-act'), btn, ev);
  }

  function onInput(ev) {
    var t = ev.target;
    if (t.getAttribute('data-role') === 'search') {
      ui.search = t.value;
      var page = document.querySelector('.page');
      if (!page) return;
      var html;
      if (ui.tab === 'clients') html = renderClients();
      else if (ui.tab === 'items') html = renderItems();
      else html = renderInvoices();
      var focused = t.selectionStart;
      page.innerHTML = html;
      var next = page.querySelector('[data-role="search"]');
      if (next) {
        next.focus();
        try { next.setSelectionRange(focused, focused); } catch (e) {}
      }
      return;
    }
    if (t.hasAttribute('data-bind')) {
      setBind(t.getAttribute('data-bind'), t.value);
      return;
    }
    if (t.hasAttribute('data-line-field') && ui.editingId) {
      var lineEl = t.closest('[data-line-id]');
      var doc = getDoc(ui.editingId);
      if (!lineEl || !doc) return;
      var line = doc.lines.find(function (l) { return l.id === lineEl.getAttribute('data-line-id'); });
      if (!line) return;
      var key = t.getAttribute('data-line-field');
      if (key === 'qty' || key === 'rate') line[key] = t.value === '' ? '' : Number(t.value);
      else line[key] = t.value;
      doc.updatedAt = new Date().toISOString();
      save();
      updateTotalsUI(doc);
    }
  }

  function onChange(ev) {
    var t = ev.target;
    if (t.id === 'logo-file' && t.files && t.files[0]) {
      resizeImage(t.files[0], 800).then(function (data) {
        state.settings.logo = data;
        if (save()) { render(); toast('Logo saved'); }
      }).catch(function () { toast('Could not read that image'); });
      t.value = '';
      return;
    }
    if (t.id === 'import-file' && t.files && t.files[0]) {
      var file = t.files[0];
      t.value = '';
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(reader.result);
          if (!data || typeof data !== 'object') throw new Error('Invalid file');
          openSheet('confirm', {
            title: 'Replace all data?',
            body: 'Importing a backup replaces invoices, clients, items, and settings currently on this device.',
            ok: 'Import',
            danger: true,
            fn: function () {
              state = {
                version: 1,
                settings: Object.assign(defaultSettings(), data.settings || {}),
                clients: data.clients || [],
                items: data.items || [],
                docs: data.docs || data.invoices || []
              };
              save();
              ui.editingId = null;
              closeSheet();
              render();
              toast('Backup imported');
            }
          });
        } catch (err) {
          toast('That file could not be imported.');
        }
      };
      reader.readAsText(file);
      return;
    }
    if (t.hasAttribute('data-bind')) setBind(t.getAttribute('data-bind'), t.value);
  }

  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);

  state = load();
  ui = { tab: 'invoices', filter: 'outstanding', editingId: null, editorMode: 'edit', search: '', sheet: null };
  render();

  window.__INVOICES_TEST__ = {
    getState: function () { return state; },
    setState: function (s) { state = s; save(); render(); },
    load: load,
    render: render,
    newDoc: newDoc,
    getDoc: getDoc,
    compute: compute,
    makePdf: makePdf,
    sendDoc: sendDoc,
    money: money,
    effectiveStatus: effectiveStatus,
    todayISO: todayISO,
    ui: ui,
    KEY: KEY
  };
})();

  </script>
</body>
</html>
